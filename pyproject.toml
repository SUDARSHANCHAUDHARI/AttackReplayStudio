[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attackreplaystudio"
version = "1.0.0"
description = "Visual incident replay dashboard that turns safe sample logs into an attack timeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
attack-replay-studio = "apps.api.app.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["apps*"]
exclude = ["apps.web*"]
